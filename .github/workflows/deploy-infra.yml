name: Deploy Infrastructure

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, prod)"
        required: true
        type: string
      api_image_tag:
        description: "Tag of noormahdi/ishqnama-api to deploy (the api_image_version output of build-backend.yml). Falls back to 'latest' for prod and 'dev' otherwise"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TFE_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_docker_hub_username: ${{ vars.DOCKERHUB_USERNAME }}
      TF_VAR_docker_hub_password: ${{ secrets.DOCKERHUB_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # A new version on every push changes the image reference, so Terraform rolls a new
      # Container App revision. Ignored by environments that do not declare the variable.
      TF_VAR_api_image_tag: ${{ inputs.api_image_tag || (inputs.environment == 'prod' && 'latest' || 'dev') }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Read API custom domain
        id: api-domain
        # Empty for environments without an API custom domain (the step below is skipped)
        run: |
          echo "hostname=$(terraform output -raw api_custom_domain 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "app=$(terraform output -raw api_container_app_name 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "aca_env=$(terraform output -raw api_environment_name 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "rg=$(terraform output -raw resource_group_name 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        if: steps.api-domain.outputs.hostname != ''
        uses: Azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bind managed certificate to API custom domain
        if: steps.api-domain.outputs.hostname != ''
        # Terraform adds the hostname to the Container App but the azurerm provider cannot issue
        # an Azure managed certificate, so this binds one (free) the first time and is a no-op
        # afterwards. The custom domain resource ignores the binding fields Azure sets here.
        env:
          HOSTNAME: ${{ steps.api-domain.outputs.hostname }}
          APP: ${{ steps.api-domain.outputs.app }}
          ACA_ENV: ${{ steps.api-domain.outputs.aca_env }}
          RG: ${{ steps.api-domain.outputs.rg }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          BINDING=$(az containerapp hostname list --name "$APP" --resource-group "$RG" \
            --query "[?name=='$HOSTNAME'].bindingType | [0]" -o tsv)
          if [ "$BINDING" = "SniEnabled" ]; then
            echo "$HOSTNAME already has a certificate bound"
            exit 0
          fi
          az containerapp hostname bind \
            --hostname "$HOSTNAME" \
            --name "$APP" \
            --resource-group "$RG" \
            --environment "$ACA_ENV" \
            --validation-method CNAME \
            --only-show-errors
