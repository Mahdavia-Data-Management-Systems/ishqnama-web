name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Backend
    permissions:
      contents: write # the API image job pushes an api-v* tag
    uses: ./.github/workflows/build-backend.yml
    with:
      environment: dev
    secrets: inherit

  setup-zone:
    name: Setup ishqnama.com
    uses: ./.github/workflows/deploy-cloudflare-zone.yml
    secrets: inherit

  infra-dev:
    name: Deploy Infrastructure (Dev)
    needs: [setup-zone, build]
    uses: ./.github/workflows/deploy-infra.yml
    with:
      environment: dev
      api_image_tag: ${{ needs.build.outputs.api_image_version }}
    secrets: inherit

  deploy-frontend-dev:
    name: Deploy Frontend (Dev)
    needs: infra-dev
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: dev
