name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"

permissions:
  id-token: write
  contents: read

# Two pushes in quick succession would otherwise race two terraform applies against the same
# Terraform Cloud workspace. Queue instead of cancelling: a half-finished apply must still finish.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # Decides which deploy jobs a push needs. A manual run (workflow_dispatch) deploys everything.
  # Each filter also includes the reusable workflow it drives, so a workflow fix gets exercised.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cloudflare: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cloudflare == 'true' }}
      infra: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      # paths-filter diffs push events with local git, so the repo must be checked out. The action
      # deepens the history itself as far as it needs to reach the previous commit.
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cloudflare:
              - "infra/environments/cloudflare/**"
              - ".github/workflows/deploy-cloudflare-zone.yml"
            infra:
              - "infra/**"
              - ".github/workflows/deploy-infra.yml"
            backend:
              - "backend/**"
              - ".github/workflows/build-backend.yml"
            frontend:
              - "frontend/**"
              - ".github/workflows/deploy-frontend.yml"

  build:
    name: Build Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: write # the API image job pushes an api-v* tag
    uses: ./.github/workflows/build-backend.yml
    with:
      environment: dev
    secrets: inherit

  # An infra-only push skips the build but still applies Terraform, which needs an image tag. This
  # resolves the version currently running in dev (the newest api-v* tag, as prod-release.yml does)
  # so the Container App keeps its exact image reference instead of flipping to the moving :dev tag.
  api-version:
    name: Resolve Current API Version
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'skipped'
      && needs.changes.outputs.infra == 'true' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so all api-v* tags are visible

      - name: Resolve newest API version
        id: version
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag -l 'api-v*.*.*' | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No api-v*.*.* tag exists yet; push a backend change or run the workflow manually to build one"
            exit 1
          fi
          VERSION="${LATEST_TAG#api-v}"
          echo "Deploying the current API version, ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  setup-zone:
    name: Setup ishqnama.com
    needs: changes
    if: needs.changes.outputs.cloudflare == 'true'
    uses: ./.github/workflows/deploy-cloudflare-zone.yml
    secrets: inherit

  # Runs for infra changes, and for backend changes because Terraform rolling the Container App to
  # the new image tag is what deploys the API. Exactly one of build and api-version produces the
  # tag: build when the backend changed, api-version otherwise. A skipped need must not skip this
  # job, hence the explicit result checks instead of the default "all needs succeeded" rule.
  infra-dev:
    name: Deploy Infrastructure (Dev)
    needs: [changes, setup-zone, build, api-version]
    if: >-
      ${{ !cancelled()
      && (needs.changes.outputs.infra == 'true' || needs.changes.outputs.backend == 'true')
      && contains(fromJSON('["success", "skipped"]'), needs.build.result)
      && contains(fromJSON('["success", "skipped"]'), needs.api-version.result)
      && contains(fromJSON('["success", "skipped"]'), needs.setup-zone.result) }}
    uses: ./.github/workflows/deploy-infra.yml
    with:
      environment: dev
      api_image_tag: ${{ needs.build.outputs.api_image_version || needs.api-version.outputs.version }}
    secrets: inherit

  # Runs for frontend changes, and whenever infra-dev actually ran because the frontend bakes the
  # SWA app settings (API URL, Entra config) into its build.
  deploy-frontend-dev:
    name: Deploy Frontend (Dev)
    needs: [changes, infra-dev]
    if: >-
      ${{ !cancelled()
      && (needs.infra-dev.result == 'success'
      || (needs.infra-dev.result == 'skipped' && needs.changes.outputs.frontend == 'true')) }}
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: dev
