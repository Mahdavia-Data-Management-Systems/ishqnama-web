name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy SWA
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Azure Login
        uses: Azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA app settings
        id: swa-settings
        run: |
          SWA_NAME="swa-ishqnama-${{ inputs.environment }}"
          RG_NAME="rg-ishqnama-${{ inputs.environment }}"
          SETTINGS=$(az staticwebapp appsettings list \
            --name "$SWA_NAME" \
            --resource-group "$RG_NAME" \
            --query "properties" -o json)
          echo "NEXT_PUBLIC_ENTRA_CLIENT_ID=$(echo "$SETTINGS" | jq -r '.NEXT_PUBLIC_ENTRA_CLIENT_ID')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_ENTRA_AUTHORITY=$(echo "$SETTINGS" | jq -r '.NEXT_PUBLIC_ENTRA_AUTHORITY')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_API_URL=$(echo "$SETTINGS" | jq -r '.NEXT_PUBLIC_API_URL')" >> "$GITHUB_ENV"
          HOSTNAME=$(az staticwebapp show --name "$SWA_NAME" --resource-group "$RG_NAME" --query "defaultHostname" -o tsv)
          echo "NEXT_PUBLIC_ENTRA_REDIRECT_URI=https://$HOSTNAME" >> "$GITHUB_ENV"
        working-directory: .

      - name: Build
        run: npm run build

      - name: Retrieve SWA deployment token from Key Vault
        id: get-token
        run: |
          TOKEN=$(az keyvault secret show \
            --vault-name "kv-ishqnama-${{ inputs.environment }}" \
            --name "swa-deployment-token" \
            --query "value" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "swa_token=$TOKEN" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-token.outputs.swa_token }}
          action: upload
          skip_app_build: true
          app_location: frontend/out
