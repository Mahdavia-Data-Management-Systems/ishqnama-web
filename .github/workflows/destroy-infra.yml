name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev, prod)"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    if: inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TFE_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_docker_hub_username: ${{ vars.DOCKERHUB_USERNAME }}
      TF_VAR_docker_hub_password: ${{ secrets.DOCKERHUB_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy Plan
        run: terraform plan -destroy -input=false

      - name: Terraform Destroy
        run: terraform apply -destroy -auto-approve -input=false

  rejected:
    name: Confirmation Failed
    if: inputs.confirm != 'DESTROY'
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation failed
        env:
          # A free-text dispatch input must never be interpolated into a shell script: GitHub expands
          # it before bash sees it, so a crafted value would execute. Pass it through env and quote.
          CONFIRM: ${{ inputs.confirm }}
        run: |
          echo "::error::Confirmation failed. You entered '$CONFIRM' but expected 'DESTROY'."
          exit 1
