# Validation for pull requests. This is the only workflow a fork can reach, so it is deliberately
# inert: the trigger is pull_request (never pull_request_target, which would run this repo's code
# with the base branch's secrets), the token is read-only, no job declares an environment, and no
# step touches Azure, Docker Hub or Terraform Cloud. Nothing here can deploy or cost money.
name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The three jobs run unconditionally rather than behind path filters: they are required status
  # checks on main, and a check that is skipped never reports, which would block the PR forever.
  frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No lint step: the repo has no ESLint config, so `npm run lint` (`next lint`) drops into an
      # interactive setup prompt and exits 1. Add the step here once ESLint is configured.

      # Deploys read NEXT_PUBLIC_* from the Static Web App's settings, which are out of reach here.
      # The static export builds without them (every read in src/config/auth-config.ts defaults),
      # so the build still proves the pages compile.
      - name: Build
        run: npm run build

  backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # fmt is the only check that needs no init. terraform validate would, and the cloud {} block
      # in each environment makes init require the Terraform Cloud token, which must not be in
      # scope in a workflow a fork can trigger. deploy-infra.yml still validates before it applies.
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infra
