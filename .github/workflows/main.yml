name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Build Docker image
        run: docker build -t ishqnama-api:ci .

  infra-dev:
    uses: ./.github/workflows/deploy-infra.yml
    with:
      environment: dev
    secrets: inherit

  infra-prod:
    needs: infra-dev
    uses: ./.github/workflows/deploy-infra.yml
    with:
      environment: prod
    secrets: inherit
