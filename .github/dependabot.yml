# Actions are pinned to commit SHAs so a compromised tag cannot be moved under us. That trades a
# supply-chain risk for a staleness one, so Dependabot keeps the pins current and rewrites both the
# SHA and the version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
